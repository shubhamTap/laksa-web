<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact LAKSA</title>
<meta name="description" content="How to reach LAKSA: who builds it and where to write.">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --navy: #020F32;
    --ink: #14243F;
    --ink-soft: #5A6472;
    --paper: #F7F7F5;
    --card: #FFFFFF;
    --rule: #E2E2DE;
    --gold: #C08A1E;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --navy: #0A1A3F;
      --ink: #E8ECF4;
      --ink-soft: #A3AEC2;
      --paper: #0B1224;
      --card: #121B31;
      --rule: #26314B;
      --gold: #E0B252;
    }
  }
  :root[data-theme="dark"] {
    --navy: #0A1A3F;
    --ink: #E8ECF4;
    --ink-soft: #A3AEC2;
    --paper: #0B1224;
    --card: #121B31;
    --rule: #26314B;
    --gold: #E0B252;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header { background: var(--navy); color: #F7F2E7; padding: 34px 24px 30px; }
  .wrap { max-width: 46rem; margin: 0 auto; width: 100%; }
  .brand-link { display: inline-block; line-height: 0; }
  .brand-logo { height: 40px; width: auto; }
  header p { margin: 12px 0 0; color: #A9B6D2; font-size: 15.5px; }
  main { flex: 1; padding: 40px 24px 56px; }
  h1 { font-size: 26px; margin: 0 0 14px; text-wrap: balance; }
  h2 { font-size: 18px; margin: 30px 0 10px; text-wrap: balance; }
  p { margin: 0 0 16px; }
  .lede { font-size: 17.5px; line-height: 1.6; }
  ul { margin: 0 0 16px; padding-left: 1.25rem; }
  li { margin-bottom: 8px; }
  .card {
    background: var(--card); border: 1px solid var(--rule);
    border-radius: 12px; padding: 22px 24px; margin-top: 26px;
  }
  .card h2 { margin-top: 0; }
  .steps { counter-reset: step; list-style: none; padding-left: 0; }
  .steps li {
    counter-increment: step; position: relative; padding-left: 2.1rem;
    margin-bottom: 12px;
  }
  .steps li::before {
    content: counter(step); position: absolute; left: 0; top: 0.1em;
    width: 1.5rem; height: 1.5rem; border-radius: 50%;
    background: var(--navy); color: #F7F2E7;
    font-size: 12.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  code {
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 5px; padding: 1px 6px; font-size: 0.92em;
  }
  a { color: var(--gold); }
  footer {
    border-top: 1px solid var(--rule); padding: 22px 24px;
    color: var(--ink-soft); font-size: 13.5px;
  }
  footer .wrap { display: flex; gap: 16px; flex-wrap: wrap; justify-content: space-between; }
  @media (max-width: 34rem) {
    header { padding: 26px 18px 24px; }
    .brand-logo { height: 32px; }
    main { padding: 28px 18px 40px; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="brand-link" href="/"><img class="brand-logo" src="/laksa-wordmark.png" alt="LAKSA"></a>
    <p>Inventory and ordering for kirana shops and thela carts</p>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>Contact</h1>
    <p class="lede">LAKSA is built by Shubham Tapadar, doing business as Laksa Technology, an
      Ontario-registered business.</p>
    <div class="card">
      <h2>Write to us</h2>
      <p><a href="mailto:hello@laksa.app">hello@laksa.app</a></p>
    </div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>&copy; Laksa Technology</span>
    <span>
      <a href="/contact.html">Contact</a>
      &nbsp;&middot;&nbsp;
      <a href="/privacy.html">Privacy Policy</a>
      &nbsp;&middot;&nbsp;
      <a href="/delete-account.html">Delete your account</a>
    </span>
  </div>
</footer>

</body>
</html>
